<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ranka och recensera dina drycker – fota och skanna etiketten med Gemini AI!">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DryckesRanken">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DryckesRanken</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // PWA Auto-Update Script (15min inactivity & 02:00-04:00 midnight window)
    (function() {
      let inactivityTimeout = null;
      let isInactive = false;

      function resetInactivityTimer() {
        clearTimeout(inactivityTimeout);
        isInactive = false;
        
        // 15 minutes of inactivity (15 * 60 * 1000 ms)
        inactivityTimeout = setTimeout(function() {
          isInactive = true;
          checkForUpdates();
        }, 15 * 60 * 1000);
      }

      async function checkForUpdates() {
        if ('serviceWorker' in navigator) {
          const now = new Date();
          const hour = now.getHours();
          const isMidnightWindow = (hour >= 2 && hour < 4);

          // Only check and update if user is inactive OR we are in the midnight window (02:00 - 04:00)
          if (isInactive || isMidnightWindow) {
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              for (const reg of registrations) {
                console.log('Checking for PWA updates (inactivity or midnight)...');
                await reg.update();
              }
            } catch (e) {
              console.warn('Failed to update service worker:', e);
            }
          }
        }
      }

      // Initialize activity listeners
      window.addEventListener('load', function() {
        resetInactivityTimer();
        const events = ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'];
        events.forEach(function(name) {
          document.addEventListener(name, resetInactivityTimer, true);
        });

        // Periodically attempt to check for updates every 5 minutes
        setInterval(checkForUpdates, 5 * 60 * 1000);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
